<div class="card shadow-sm mx-auto" style="max-width: 400px; margin-top: 100px;">
  <div class="card-body">
    <h4 class="card-title mb-3">Login</h4>
    <form [formGroup]="form" (ngSubmit)="login()">
      <div class="mb-3">
        <label>Email</label>
        <input type="email" formControlName="email" class="form-control" />
        <div *ngIf="form.get('email')?.touched && form.get('email')?.invalid" class="text-danger small">
          Valid email is required.
        </div>
      </div>

      <div class="mb-3">
        <label>Password</label>
        <input type="password" formControlName="password" class="form-control" />
        <div *ngIf="form.get('password')?.touched && form.get('password')?.invalid" class="text-danger small">
          Password is required.
        </div>
      </div>

      <button class="btn btn-primary w-100" [disabled]="loading">{{ loading ? 'Logging in...' : 'Login' }}</button>
      <div *ngIf="error" class="text-danger mt-2">{{ error }}</div>
    </form>
  </div>
</div>
