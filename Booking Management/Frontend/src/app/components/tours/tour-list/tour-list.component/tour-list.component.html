<div class="card shadow-sm">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h5 class="mb-0">All Tours</h5>
    <a routerLink="/tours/new" class="btn btn-sm btn-success">+ New Tour</a>
  </div>
  <div class="card-body">
    <div *ngIf="loading" class="text-center">Loading...</div>
    <div *ngIf="error" class="alert alert-danger">{{ error }}</div>
    <div class="row g-3">
      <div class="col-md-4" *ngFor="let tour of tours">
        <div class="card h-100">
          <div class="card-body d-flex flex-column">
            <h6 class="card-title">{{ tour.title }}</h6>
            <p class="card-text text-truncate">{{ tour.description }}</p>
            <div class="mt-auto d-flex justify-content-between align-items-center">
              <div class="text-muted">LKR {{ tour.price }}</div>
              <div>
                <a [routerLink]="['/tours', tour.id]" class="btn btn-sm btn-outline-primary me-1">View</a>
                <button (click)="edit(tour)" class="btn btn-sm btn-primary me-1">Edit</button>
                <button (click)="remove(tour)" class="btn btn-sm btn-danger">Delete</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>
