<section class="hero bg-gradient text-white py-5 rounded-3 mb-4">
  <div class="container">
    <div class="row align-items-center">
      <div class="col-md-7">
        <h1 class="display-5 fw-bold">Discover unforgettable trips</h1>
        <p class="lead">Hand-picked tours, vibrant experiences, and friendly prices.</p>
        <a routerLink="/tours" class="btn btn-light btn-lg text-primary">Browse Tours</a>
      </div>
      
      <!-- Image Slider -->
      <div class="col-md-5 d-none d-md-block">
        <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
          <!-- Indicators -->
          <div class="carousel-indicators">
            <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active"></button>
            <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1"></button>
            <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2"></button>
          </div>

          <!-- Slides -->
          <div class="carousel-inner rounded shadow-lg">
            <div class="carousel-item active" data-bs-interval="3000">
              <img src="assets/images_4.jpg" class="d-block w-100 img-fluid" alt="Travel 1">
            </div>
            <div class="carousel-item" data-bs-interval="3000">
              <img src="assets/image_2.jpg" class="d-block w-100 img-fluid" alt="Travel 2">
            </div>
            <div class="carousel-item" data-bs-interval="3000">
              <img src="assets/images_5.jpg" class="d-block w-100 img-fluid" alt="Travel 3">
            </div>
          </div>

          <!-- Controls -->
          <button class="carousel-control-prev" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
          </button>
        </div>

      </div>
      <!-- End Slider -->

    </div>
  </div>
</section>

<div class="container">
  <h3 class="mb-3">Featured Tours</h3>
  <div *ngIf="loading" class="text-center py-4">Loading...</div>
  <div class="row g-3">
    <div class="col-md-4" *ngFor="let t of featured">
      <div class="card h-100 shadow-sm">
        <div class="card-body">
          <h5 class="card-title">{{ t.title }}</h5>
          <p class="card-text ">{{ t.description }}</p>
          <p class="card-text"><small class="text-muted">Duration: {{ t.durationDays }} days</small></p>
          <div class="d-flex justify-content-between align-items-center">
            <div class="fw-bold">One Person Price : LKR {{ t.price }}</div>
            <!-- <a [routerLink]="['/tours', t.id]" class="btn btn-sm btn-primary">View</a> -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
